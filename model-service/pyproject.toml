[build-system]
requires = ["setuptools==83.0.0"]
build-backend = "setuptools.build_meta"

[project]
name = "knowagent-model-service"
version = "0.1.0"
description = "Internal HTTP boundary for KnowAgent embedding and rerank models"
requires-python = ">=3.11,<3.12"
dependencies = [
  "fastapi==0.141.1",
  "httpx==0.28.1",
  "pydantic==2.13.4",
  "uvicorn==0.52.1",
]

[project.scripts]
knowagent-model-service = "knowagent_model.cli:main"

[project.optional-dependencies]
dev = [
  "bandit==1.9.4",
  "black==26.5.1",
  "isort==8.0.1",
  "mypy==2.3.0",
  "pylint==4.0.6",
  "pytest==9.1.1",
  "pytest-cov==7.1.0",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.black]
line-length = 100
target-version = ["py311"]

[tool.isort]
profile = "black"
line_length = 100

[tool.mypy]
python_version = "3.11"
strict = true
packages = ["knowagent_model"]
mypy_path = "src"

[tool.pylint.main]
py-version = "3.11"
source-roots = ["src"]

[tool.pylint."messages control"]
disable = ["C0114", "C0115", "C0116"]

[tool.pylint.format]
max-line-length = 100

[tool.bandit]
exclude_dirs = ["tests"]
severity = "MEDIUM"

[tool.pytest.ini_options]
addopts = "--cov=knowagent_model --cov-report=term-missing --cov-fail-under=80"
testpaths = ["tests"]
markers = [
  "integration: requires explicitly configured live external services",
]

[tool.coverage.run]
branch = true
source = ["knowagent_model"]

[tool.coverage.report]
fail_under = 80
show_missing = true
